<!doctype html>
<!-- Preview host: plays the reusable cards back to back. Each card renders on its own:
     npx hyperframes render -c compositions/title-card.html --format webm --resolution 4k
     npx hyperframes render -c compositions/end-card.html   --format webm --resolution 4k -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2f8f8a; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.3" data-width="1920" data-height="1080">
      <div id="slot-title" data-composition-id="title-card" class="clip" data-composition-src="compositions/title-card.html"
           data-start="0" data-duration="6.3" data-track-index="1"></div>
      <div id="slot-end" data-composition-id="end-card" class="clip" data-composition-src="compositions/end-card.html"
           data-start="6.3" data-duration="6" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 12.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
