<!doctype html>
<!--
  CutCrew — FACT CARD (reusable template)
  Transparent overlay that backs up a fact said in a caption with the real web page:
  the page pops in inside a clean browser window, pushes in on the sentence that proves
  the fact, and a purple marker sweeps over it. Shown over a calm moment, like inner-talk.
  The screenshot comes from scripts/grab.py, which prints the variables below ready to paste.
    shot    screenshot path inside animations/   ("assets/facts/fact-1.png")
    rects   JSON list of the fact's line boxes  ('[{"x":264,"y":490,"w":199,"h":17}]')
    vw, vh  page size the screenshot was taken at (1440 × 900)
    domain  shown in the address bar and the label ("en.wikipedia.org")
    label   pill text                            ("SOURCE")
    hold    seconds the highlighted fact stays readable (4)
  Render (4K, transparent):
    npx hyperframes render -c compositions/fact-card.html --format webm --resolution 4k \
      --variables '{…from grab.py…,"hold":4}' -o ../projects/<name>/assets/fact-1.webm
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"shot","type":"string","label":"Screenshot","default":"assets/facts/sample.png"},
    {"id":"rects","type":"string","label":"Fact line boxes (JSON)","default":"[{\"x\":264,\"y\":490,\"w\":199,\"h\":17}]"},
    {"id":"vw","type":"number","label":"Page width","default":1440,"min":320,"max":3840,"step":1},
    {"id":"vh","type":"number","label":"Page height","default":900,"min":320,"max":3840,"step":1},
    {"id":"domain","type":"string","label":"Website","default":"en.wikipedia.org"},
    {"id":"label","type":"string","label":"Pill label","default":"SOURCE"},
    {"id":"hold","type":"number","label":"Hold (s)","default":4,"min":1.5,"max":20,"step":0.1,"unit":"s"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <style>
      @font-face {
        font-family: "HN Display";
        src: url("/assets/fonts/SegUIVar.ttf") format("truetype");
        font-weight: 300 900;
      }
      @font-face {
        font-family: "HN Label";
        src: url("/assets/fonts/bahnschrift.ttf") format("truetype");
        font-weight: 300 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

      #fact-card {
        --purple: #5a46d6;
        --purple-deep: #3d2ea8;
        --purple-soft: #ece9fb;
        --ink: #1d1638;
        --paper: #ffffff;
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* soft darkening behind the card so the page reads over busy footage */
      #fc-scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(18, 10, 52, 0.42) 0%, rgba(18, 10, 52, 0.18) 60%, rgba(18, 10, 52, 0) 100%);
      }
      #fc-float { position: relative; display: block; margin-top: 70px; }
      #fc-window {
        position: relative;
        display: block;
        width: 1240px;
        border-radius: 26px;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 30px 80px rgba(18, 10, 52, 0.45), 0 6px 16px rgba(18, 10, 52, 0.25);
      }
      #fc-bar {
        display: flex;
        align-items: center;
        gap: 22px;
        height: 64px;
        padding: 0 24px;
        background: var(--purple-soft);
        border-bottom: 2px solid #d9d3f7;
      }
      #fc-dots { display: flex; gap: 10px; flex: none; }
      .fc-dot { width: 16px; height: 16px; border-radius: 50%; background: #c9c1f3; }
      .fc-dot:first-child { background: var(--purple); }
      #fc-url {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        height: 40px;
        padding: 0 20px;
        border-radius: 20px;
        background: var(--paper);
        font-family: "HN Display", sans-serif;
        font-weight: 600;
        font-size: 22px;
        color: var(--ink);
      }
      #fc-url svg { width: 18px; height: 18px; flex: none; }
      #fc-view { position: relative; display: block; width: 1240px; height: 775px; overflow: hidden; background: #fff; }
      #fc-page { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #fc-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
      .fc-mark {
        position: absolute;
        display: block;
        border-radius: 4px;
        /* plain blend, not multiply: multiply vanishes on dark pages (e.g. GSC) */
        background: rgba(90, 70, 214, 0.26);
        border-bottom: 3px solid var(--purple);
        box-shadow: 0 0 0 2px rgba(90, 70, 214, 0.35);
        transform-origin: 0% 50%;
      }
      #fc-pill {
        position: absolute;
        left: 34px;
        top: -72px;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 56px;
        padding: 0 26px 0 22px;
        border-radius: 28px;
        background: linear-gradient(180deg, var(--purple) 0%, var(--purple-deep) 100%);
        box-shadow: 0 10px 26px rgba(18, 10, 52, 0.35);
        font-family: "HN Label", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.08em;
        color: var(--paper);
        white-space: nowrap;
        z-index: 2;
      }
      #fc-pill svg { width: 26px; height: 26px; flex: none; }
      #fc-pill-domain { font-family: "HN Display", sans-serif; font-weight: 600; letter-spacing: 0; opacity: 0.85; }
    </style>

    <div id="fact-card" data-composition-id="fact-card" data-width="1920" data-height="1080">
      <div id="fc-scrim"></div>
      <div id="fc-float">
        <div id="fc-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span id="fc-pill-label">SOURCE</span>
          <span id="fc-pill-domain"></span>
        </div>
        <div id="fc-window">
          <div id="fc-bar">
            <div id="fc-dots"><span class="fc-dot"></span><span class="fc-dot"></span><span class="fc-dot"></span></div>
            <div id="fc-url">
              <svg viewBox="0 0 24 24" fill="none" stroke="#5a46d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <span id="fc-url-text"></span>
            </div>
          </div>
          <div id="fc-view">
            <div id="fc-page">
              <img id="fc-img" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const hold = Math.max(1.5, Number(vars.hold) || 4);
        const vw = Number(vars.vw) || 1440, vh = Number(vars.vh) || 900;
        const domain = String(vars.domain || "en.wikipedia.org");
        let rects = [];
        try { rects = JSON.parse(vars.rects || "[]"); } catch (e) { rects = []; }
        if (!rects.length) rects = [{ x: vw * 0.3, y: vh * 0.45, w: vw * 0.4, h: 20 }];

        document.getElementById("fc-pill-label").textContent = String(vars.label || "SOURCE");
        document.getElementById("fc-pill-domain").textContent = domain;
        document.getElementById("fc-url-text").textContent = domain;
        document.getElementById("fc-img").src = String(vars.shot || "assets/facts/sample.png");

        // The page lives in its own pixel space (vw × vh) so the marks line up with the screenshot.
        const page = document.getElementById("fc-page");
        page.style.width = vw + "px";
        page.style.height = vh + "px";
        const marks = rects.map((r) => {
          const m = document.createElement("span");
          m.className = "fc-mark";
          m.style.left = r.x - 4 + "px";
          m.style.top = r.y - 3 + "px";
          m.style.width = r.w + 8 + "px";
          m.style.height = r.h + 6 + "px";
          page.appendChild(m);
          return m;
        });

        // Push-in: frame the fact's lines in the middle of the window, never past the page edge.
        const W = 1240, H = 775, s0 = W / vw;
        // The frame is at least 45% of the page wide so the whole sentence around the fact stays readable.
        let bx = Math.min(...rects.map((r) => r.x)) - 60, by = Math.min(...rects.map((r) => r.y)) - 40;
        let bw = Math.max(...rects.map((r) => r.x + r.w)) + 60 - bx, bh = Math.max(...rects.map((r) => r.y + r.h)) + 40 - by;
        const minW = 0.45 * vw;
        if (bw < minW) { bx = Math.max(0, Math.min(vw - minW, bx - (minW - bw) / 2)); bw = minW; }
        const z = Math.min(2.0, Math.max(1, Math.min((0.92 * vw) / bw, (0.55 * vh) / bh)));
        const S = s0 * z;
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const tx = clamp(W / 2 - (bx + bw / 2) * S, W - vw * S, 0);
        const ty = clamp(H / 2 - (by + bh / 2) * S, H - vh * S, 0);

        const tl = gsap.timeline({ paused: true });

        // In: scrim, then the window pops up with the source pill.
        tl.fromTo("#fc-scrim", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, 0);
        tl.fromTo("#fc-window",
          { autoAlpha: 0, y: 60, scale: 0.9, rotation: 1.5 },
          { autoAlpha: 1, y: 0, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.5)" }, 0.15);
        tl.fromTo("#fc-pill",
          { autoAlpha: 0, y: 20, scale: 0.8 },
          { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2.2)", transformOrigin: "0% 100%" }, 0.5);
        // Push in on the fact (whole page fits the window until then), then the marker sweeps each line.
        tl.fromTo("#fc-page", { x: 0, y: 0, scale: s0 }, { x: tx, y: ty, scale: S, duration: 1.3, ease: "power3.inOut" }, 1.1);
        tl.fromTo(marks, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.22 }, 2.3);

        // Hold: a gentle float so it never looks frozen.
        const markEnd = 2.3 + 0.45 + 0.22 * (marks.length - 1);
        const outAt = markEnd + hold;
        const breaths = Math.max(0, Math.floor((outAt - 1.0) / 1.8));
        if (breaths > 0) {
          tl.to("#fc-float", { y: -6, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: breaths * 2 - 1 }, 1.0);
        }

        // Out: everything shrinks away and the footage comes back.
        tl.to(["#fc-window", "#fc-pill"], { autoAlpha: 0, scale: 0.92, y: -24, duration: 0.4, ease: "power2.in" }, outAt);
        tl.to("#fc-scrim", { autoAlpha: 0, duration: 0.45, ease: "power1.in" }, outAt);
        tl.set({}, {}, outAt + 0.5);

        window.__timelines["fact-card"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
